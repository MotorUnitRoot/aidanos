name: eslint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
      - name: eslint
        run: npx --yes eslint@9.39.5 .
