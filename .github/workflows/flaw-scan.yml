name: flaw-scan

# Weekly scan of the repository and the hosted image. It also runs when
# someone starts it by hand. It is not a pull-request check, so it cannot
# be required for merge.
on:
  schedule:
    # Monday 15:17 UTC.
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flaw-scan:
    name: flaw-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"

      - name: Self-test the ranking rules
        run: node .github/flaw-scan.mjs --self-test

      - name: Build the hosted image
        run: docker build -t aidanos-flaw-scan:local .

      - name: Read the image runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/node aidanos-flaw-scan:local --version > image-node.txt
          docker run --rm --entrypoint /bin/cat aidanos-flaw-scan:local /etc/os-release > image-os-release
          echo "image node: $(tr -d '[:space:]' < image-node.txt)"

      - name: Scan the hosted image
        # Trivy v0.76.0 is the release this pinned action installs. The
        # install script checks that release's checksum. The action has no
        # image-digest input, so the binary is pinned by release tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aidanos-flaw-scan:local
          format: json
          output: trivy-image.json
          scanners: vuln
          exit-code: "0"
          hide-progress: "true"
          timeout: 15m
          version: v0.76.0
          cache: "false"

      - name: Scan the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-repo.json
          scanners: vuln
          exit-code: "0"
          hide-progress: "true"
          timeout: 15m
          version: v0.76.0
          cache: "false"

      - name: Download public lists
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json" -o kev.json
          curl -fsSL "https://raw.githubusercontent.com/nodejs/Release/main/schedule.json" -o node-schedule.json
          curl -fsSL "https://endoflife.date/api/nodejs.json" -o node-eol.json
          curl -fsSL "https://endoflife.date/api/debian.json" -o debian-eol.json

      - name: Rank findings
        shell: bash
        run: |
          set -euo pipefail
          node .github/flaw-scan.mjs \
            --image trivy-image.json \
            --repo trivy-repo.json \
            --kev kev.json \
            --node-version image-node.txt \
            --os-release image-os-release \
            --node-schedule node-schedule.json \
            --node-eol node-eol.json \
            --debian-eol debian-eol.json \
            --actions-node .nvmrc \
            --dockerfile Dockerfile \
            --today "$(date -u +%Y-%m-%d)" \
            --scanner "Trivy v0.76.0" \
            --out-md flaw-scan-out/summary.md \
            --out-json flaw-scan-out/report.json

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaw-scan
          path: |
            flaw-scan-out/summary.md
            flaw-scan-out/report.json
            trivy-image.json
            trivy-repo.json
          if-no-files-found: warn
          retention-days: 30
