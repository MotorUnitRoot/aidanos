name: independent-review-post

# Sets the binding status independent-review/approved. issue_comment runs
# this file from the default branch, so a deployment branch rule of main
# holds. The parse job has no secrets. post-pass waits in the fixed
# environment independent-review. post-block uses the fixed environment
# independent-review-block, which has no reviewer, so it starts immediately.
# Both environments define REVIEW_APP_PRIVATE_KEY and the environment
# variable REVIEW_APP_ID. The private key is not printed. Do not add set -x.
#
# No concurrency on the workflow. Each post job has its own group, keyed by
# pull request and verdict, with cancel-in-progress off. A PASS job cannot
# cancel a BLOCK job. A waiting PASS holds its own slot: reject that stale
# PASS before approving a newer one. A PASS that is only queued can be
# cancelled when a newer PASS is queued.
run-name: "independent-review #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  parse:
    if: github.event.issue.pull_request
    name: parse verdict
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.request.outputs.verdict }}
      sha: ${{ steps.request.outputs.sha }}
      short: ${{ steps.request.outputs.short }}
      pr: ${{ steps.request.outputs.pr }}
      comment_id: ${{ steps.request.outputs.comment_id }}
      body_sha256: ${{ steps.request.outputs.body_sha256 }}
    steps:
      - name: Checkout default branch
        # v5.1.0 — default branch SHA. issue_comment does not check out the pull request head.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        # v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Read the verdict
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/post-review-verdict.mjs --parse-request

  post-pass:
    needs: parse
    if: ${{ needs.parse.result == 'success' && needs.parse.outputs.verdict == 'PASS' }}
    name: "#${{ needs.parse.outputs.pr }} PASS ${{ needs.parse.outputs.short }}"
    runs-on: ubuntu-latest
    concurrency:
      group: independent-review-post-${{ needs.parse.outputs.pr }}-PASS
      cancel-in-progress: false
    environment: independent-review
    permissions:
      contents: read
    steps:
      - name: Record the verdict
        env:
          REVIEW_PR: ${{ needs.parse.outputs.pr }}
          REVIEW_SHORT: ${{ needs.parse.outputs.short }}
          REVIEW_SHA: ${{ needs.parse.outputs.sha }}
        run: |
          {
            echo "### Independent review #${REVIEW_PR}"
            echo ""
            echo "**PASS** \`${REVIEW_SHORT}\`"
            echo ""
            echo "Full commit \`${REVIEW_SHA}\`."
            echo ""
            echo "PASS waits for approval in independent-review."
            echo "Reject a stale PASS before approving a newer one."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout default branch
        # v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        # v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Mint the review App token
        id: app-token
        # v3.3.0. Statuses to write the gate. Pull requests to re-read the
        # head and the verdict comment. Conversation comments work with
        # pull requests read. REVIEW_APP_ID is an environment variable on
        # independent-review. This token does not request checks.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-pull-requests: read
      - name: Set independent-review/approved
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_GATE_PASS_ENV: ${{ vars.REVIEW_GATE_PASS_ENV }}
          REVIEW_PR: ${{ needs.parse.outputs.pr }}
          REVIEW_SHA: ${{ needs.parse.outputs.sha }}
          REVIEW_COMMENT_ID: ${{ needs.parse.outputs.comment_id }}
          REVIEW_BODY_SHA256: ${{ needs.parse.outputs.body_sha256 }}
        run: node tools/post-review-verdict.mjs "$REVIEW_PR" PASS "$REVIEW_SHA" --status-only --comment-id "$REVIEW_COMMENT_ID" --body-sha256 "$REVIEW_BODY_SHA256"

  post-block:
    needs: parse
    if: ${{ needs.parse.result == 'success' && needs.parse.outputs.verdict == 'BLOCK' }}
    name: "#${{ needs.parse.outputs.pr }} BLOCK ${{ needs.parse.outputs.short }}"
    runs-on: ubuntu-latest
    concurrency:
      group: independent-review-post-${{ needs.parse.outputs.pr }}-BLOCK
      cancel-in-progress: false
    environment: independent-review-block
    permissions:
      contents: read
    steps:
      - name: Record the verdict
        env:
          REVIEW_PR: ${{ needs.parse.outputs.pr }}
          REVIEW_SHORT: ${{ needs.parse.outputs.short }}
          REVIEW_SHA: ${{ needs.parse.outputs.sha }}
        run: |
          {
            echo "### Independent review #${REVIEW_PR}"
            echo ""
            echo "**BLOCK** \`${REVIEW_SHORT}\`"
            echo ""
            echo "Full commit \`${REVIEW_SHA}\`."
            echo ""
            echo "BLOCK uses independent-review-block and applies without a reviewer."
            echo "A BLOCK stays on this commit until a new push."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout default branch
        # v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        # v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Mint the review App token
        id: app-token
        # v3.3.0. Statuses to write the failure. Pull requests to re-read
        # the head. REVIEW_APP_ID is an environment variable on
        # independent-review-block. A BLOCK does not call the checks API,
        # so this token does not request checks.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-pull-requests: read
      - name: Set independent-review/approved
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_PR: ${{ needs.parse.outputs.pr }}
          REVIEW_SHA: ${{ needs.parse.outputs.sha }}
        run: node tools/post-review-verdict.mjs "$REVIEW_PR" BLOCK "$REVIEW_SHA" --status-only
