name: judge-advisory

# Read-only mirror of the approval gate. This workflow does not write
# approval-gate and does not read the gate App key. approval-gate.yml
# writes that status with the gate-only App.
#
# A pull_request run checks out the merge commit so the self-test covers
# this pull request's files. It stays read-only. pull_request_target
# checks out github.sha and never runs the pull request head.
#
# One advisory run at a time per pull request. cancel-in-progress is off.
concurrency:
  group: independent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  independent-review-advisory:
    if: github.event_name == 'pull_request'
    name: judge (advisory)
    runs-on: ubuntu-latest
    # Early signal only. A pull request can change this job. It stays
    # read-only. issues: read lists conversation comments.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        # v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Node.js
        # v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Self-test
        run: node .github/independent-review.mjs --self-test && node tools/post-review-verdict.mjs --self-test && node .github/approval-gate.mjs --self-test
      - name: Advisory approval gate for this head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/approval-gate.mjs --advisory

  # Default-branch workflow only. Checkout stays on github.sha.
  # Read-only: this job must not post the binding status.
  independent-review-advisory-from-main:
    if: github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    name: judge (advisory, from base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout default branch
        # v5.1.0 — base branch SHA, never the pull request head.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        # v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Self-test
        run: node .github/independent-review.mjs --self-test && node tools/post-review-verdict.mjs --self-test && node .github/approval-gate.mjs --self-test
      - name: Advisory approval gate for this head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/approval-gate.mjs --advisory
