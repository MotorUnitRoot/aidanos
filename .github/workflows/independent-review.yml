name: independent-review

# Advisory signal only. This workflow does not post
# independent-review/approved and has no statuses or checks write.
# independent-review-post.yml posts that status. PASS waits for the
# independent-review environment. BLOCK uses independent-review-block
# and does not wait.
#
# One advisory run at a time per pull request. cancel-in-progress is
# off, so an advisory run that has started is not cancelled. This group
# does not order the binding status. independent-review-post.yml posts
# that status.
concurrency:
  group: independent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  independent-review-advisory:
    if: github.event_name == 'pull_request'
    name: independent-review (advisory)
    runs-on: ubuntu-latest
    # Early signal only. A pull request can change this job. It stays
    # read-only. issues: read lists conversation comments.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        # v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Node.js
        # v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Self-test
        run: node .github/independent-review.mjs --self-test && node tools/post-review-verdict.mjs --self-test
      - name: Advisory review signal for this head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/independent-review.mjs

  # Default-branch workflow only. Checkout stays on github.sha.
  # Read-only: this job must not post the binding status.
  independent-review-advisory-from-main:
    if: github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    name: independent-review (advisory, from main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout default branch
        # v5.1.0 — base branch SHA, never the pull request head.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        # v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Self-test
        run: node .github/independent-review.mjs --self-test && node tools/post-review-verdict.mjs --self-test
      - name: Advisory review signal for this head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/independent-review.mjs
