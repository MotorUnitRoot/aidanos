name: no-runtime-deps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-runtime-deps:
    name: no-runtime-deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        # v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: runtime dependency fields must be empty
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";
          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          const fields = ["dependencies", "optionalDependencies", "peerDependencies"];
          let failed = false;
          for (const field of fields) {
            const value = pkg[field];
            if (value == null) {
              console.log("package.json has no " + field + " field");
              continue;
            }
            if (typeof value !== "object" || Array.isArray(value)) {
              console.error("package.json " + field + " must be an object");
              failed = true;
              continue;
            }
            const names = Object.keys(value);
            if (names.length > 0) {
              console.error("package.json " + field + " is not empty: " + names.join(", "));
              failed = true;
              continue;
            }
            console.log("package.json " + field + " is empty");
          }
          process.exit(failed ? 1 : 0);
          EOF
