name: syntax

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
      - name: node --check
        shell: bash
        run: |
          set -euo pipefail
          status=0
          found=0
          while IFS= read -r -d '' file; do
            case "$file" in
              public/fonts/*) continue ;;
            esac
            found=1
            echo "node --check $file"
            node --check "$file" || status=1
          done < <(git ls-files -z '*.js' '*.mjs')
          if [ "$found" -eq 0 ]; then
            echo "No tracked JS files to check."
          fi
          exit "$status"
