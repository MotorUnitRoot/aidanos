name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
      - name: Chrome for the phone width check
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0 release
        with:
          chrome-version: "156.0.8078.47"
          install-dependencies: true
      - name: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test
      - name: flaw-scan rules
        run: node .github/flaw-scan.mjs --self-test

  tests-macos:
    name: tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
      - name: Chrome for the phone width check
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0 release
        with:
          chrome-version: "156.0.8078.47"
          install-dependencies: true
      - name: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test
