name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
      - name: npm test
        run: npm test
