<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Door — AidanOS pattern</title>
  <link rel="stylesheet" href="../foundations/tokens.css" />
  <link rel="stylesheet" href="../components/primitives.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: var(--ink);
      min-height: 100dvh;
    }
    .caption {
      position: absolute;
      top: var(--space-3);
      left: var(--space-3);
      margin: 0;
      max-width: 22rem;
      color: var(--faint);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .door {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      padding: var(--space-5);
    }
  </style>
</head>
<body>
  <p class="caption">Empty Door. The prompt bar and two hairline buttons. Get to Work and Capture thoughts are the same button. No thread. No nav mall.</p>
  <div class="door">
    <div class="prompt">
      <input type="text" placeholder="What do you want to do today?" />
    </div>
    <button type="button" class="hairline-button">Get to Work</button>
    <button type="button" class="hairline-button">Capture thoughts</button>
  </div>
</body>
</html>
