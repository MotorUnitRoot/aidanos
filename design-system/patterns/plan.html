<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan — AidanOS pattern</title>
  <link rel="stylesheet" href="../foundations/tokens.css" />
  <link rel="stylesheet" href="../components/primitives.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .sheet {
      width: var(--paper);
      max-width: 100%;
      margin: 0 auto;
      padding: var(--space-5) var(--space-4) var(--space-6);
    }
    .nav {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin: 0 0 var(--space-5);
      padding-bottom: 0.55rem;
      border-bottom: var(--line) solid var(--hairline);
    }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="nav">
      <a href="today.html" class="text-link">Today</a>
      <a href="plan.html" class="text-link is-current">Plan</a>
    </header>
    <div class="paper">
      <h1>Stay on the plan</h1>
      <p>The thing standing in the way is staying on the plan.</p>
      <p class="quiet-label">Next steps</p>
      <div class="task">
        <span class="box" aria-hidden="true"></span>
        <span class="words">Live this week as written</span>
      </div>
      <div class="task">
        <span class="box" aria-hidden="true"></span>
        <span class="words">Writing floor each train day</span>
      </div>
      <p class="quiet-label">Waiting</p>
      <p>Personal app polish beyond what serves this week.</p>
    </div>
  </div>
</body>
</html>
