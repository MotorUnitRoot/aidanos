<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#161513" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AidanOS" />
  <title>AidanOS</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/day.css?v=fmt-kb3" />
  <link rel="stylesheet" href="/api/skin.css" />
</head>
<body class="day-page view-door">
  <main id="view-door" class="view view-door-screen">
    <div class="door-only">
      <form id="door-form" autocomplete="off">
        <label class="sr-only" for="door-input">What do you want to do today?</label>
        <div class="door-bar">
          <input type="text" id="door-input" name="q" placeholder="What do you want to do today?" maxlength="240" autofocus />
          <button type="submit" class="door-return" aria-label="Enter">&#8629;</button>
        </div>
        <div id="door-proposals" class="door-proposals" hidden></div>
        <div id="door-decide" class="door-decide" hidden>
          <button type="button" id="door-accept" class="hairline-button">Accept</button>
          <button type="button" id="door-reject" class="hairline-button">Reject</button>
        </div>
      </form>
      <div class="door-actions" role="group" aria-label="Start">
        <button type="button" id="door-skip" class="hairline-button">Get to Work</button>
        <button type="button" id="door-capture" class="hairline-button">Capture thoughts</button>
      </div>
    </div>
  </main>

  <main id="view-today" class="view view-today-screen" hidden>
    <div class="today-room">
      <section class="today-left">
        <header class="today-nav">
          <a href="#today" class="text-link is-current">Today</a>
          <a href="#plan" class="text-link">Plan</a>
          <button type="button" id="toggle-rail" class="text-link rail-toggle" aria-expanded="false">Timeline</button>
          <p id="status" class="status" aria-live="polite"></p>
        </header>
        <section class="week-row" aria-label="Week">
          <div id="days" class="days" role="list"></div>
          <div class="week-arrows">
            <button type="button" id="prev-week" class="icon-btn" aria-label="Previous week">&#8249;</button>
            <button type="button" id="next-week" class="icon-btn" aria-label="Next week">&#8250;</button>
          </div>
        </section>
        <div id="dump-wrap" class="paper-wrap">
          <div class="paper-head">
            <h1 id="paper-title" class="paper-title"></h1>
            <p class="day-shift">
              <button type="button" id="prev-day" class="text-link" aria-label="Previous day">&#8249;</button>
              <button type="button" id="next-day" class="text-link" aria-label="Next day">&#8250;</button>
            </p>
          </div>
          <label class="sr-only" for="dump">Today note</label>
          <textarea id="dump" class="dump-src sr-only" rows="16" placeholder="Write."></textarea>
          <div id="paper" class="paper" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Today note" data-placeholder="Write."></div>
        </div>
        <button type="button" id="ask-open" class="ask-line">
          <span>Ask or find</span>
          <span class="ask-x" aria-hidden="true">x</span>
        </button>
      </section>
      <aside class="today-rail" aria-label="Day timeline">
        <header class="rail-head">
          <p id="rail-date" class="rail-date"></p>
          <button type="button" id="toggle-month" class="text-link month-link">Month</button>
        </header>
        <div id="month-grid" class="month-grid hidden" hidden></div>
        <div id="timeline" class="timeline" tabindex="-1"></div>
      </aside>
    </div>
  </main>

  <section id="view-plan" class="view view-plan" hidden>
    <p class="back"><a href="#today" class="text-link">Today</a></p>
    <h1 id="plan-title">Plan</h1>
    <p id="plan-why" class="form-lead"></p>
    <p class="kicker">Next steps</p>
    <ol id="plan-steps" class="steps"></ol>
    <p class="kicker parked-k">Waiting</p>
    <ul id="plan-parked" class="parked"></ul>
  </section>

  <div id="ask-modal" class="ask-modal hidden" hidden>
    <div class="ask-sheet" role="dialog" aria-modal="true" aria-labelledby="ask-heading">
      <header class="ask-head">
        <h2 id="ask-heading">Ask or find</h2>
        <button type="button" id="ask-close" class="text-link" aria-label="Close">x</button>
      </header>
      <form id="ask-form" class="ask-form" autocomplete="off">
        <label class="sr-only" for="ask-q">Ask or find</label>
        <input type="text" id="ask-q" placeholder="Ask or find" />
      </form>
      <ul id="ask-hits" class="ask-hits"></ul>
    </div>
  </div>

  <div id="fmt-bar" class="fmt-bar" hidden role="toolbar" aria-label="Formatting">
    <button type="button" class="fmt-btn" data-fmt="task" aria-label="Task" title="Task">
      <svg class="fmt-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.2 12.2l2.4 2.4 5.2-5.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="fmt-btn" data-fmt="style" aria-label="Text style" title="Text style">A</button>
    <button type="button" class="fmt-btn" data-fmt="undo" aria-label="Undo" title="Undo">
      <svg class="fmt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5A6 6 0 1 1 7 16.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8.5 4.8v4.2H4.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="fmt-btn" data-fmt="indent" aria-label="Indent" title="Indent">
      <svg class="fmt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h6M5 18h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14 9.5L17.5 12 14 14.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 12H11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="fmt-btn" data-fmt="find" aria-label="Find" title="Find">
      <svg class="fmt-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M15 15l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="fmt-btn" data-fmt="wand" aria-label="Wand" title="Ask">
      <svg class="fmt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 16.5L16.5 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M15.2 5.2l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6zM8.2 14.2l.45 1.15 1.15.45-1.15.45-.45 1.15-.45-1.15-1.15-.45 1.15-.45zM18.5 11.2l.35.9.9.35-.9.35-.35.9-.35-.9-.9-.35.9-.35z" fill="currentColor"/></svg>
    </button>
    <button type="button" class="fmt-btn" data-fmt="command" aria-label="Command" title="Command">
      <svg class="fmt-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 8.5c0-1.66-1.34-3-3-3s-3 1.34-3 3 1.34 3 3 3H8.5M15.5 8.5c0-1.66 1.34-3 3-3s3 1.34 3 3-1.34 3-3 3H15.5M8.5 15.5c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3H8.5M15.5 15.5c0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3H15.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <script src="/app.js?v=fmt-kb3" type="module"></script>
</body>
</html>
